name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  GRADLE_CACHE_KEY: jester-gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'app/build.gradle', 'identity-shell-template/build.gradle') }}
  GRADLE_CACHE_KEY_FALLBACK: jester-gradle-${{ runner.os }}-

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew wrapper --version
      - run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true
      - run: ./gradlew ktlintCheck --no-daemon
        continue-on-error: true

  build:
    name: Build Android (${{ matrix.flavor }} ${{ matrix.build_type }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [root, nonroot]
        build_type: [release, debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r26d
          cmake-version: 3.22.1

      - run: chmod +x gradlew
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: ${{ env.GRADLE_CACHE_KEY_FALLBACK }}

      - name: Configure signing
        if: matrix.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            cat > keystore.properties <<EOF
            storeFile=keystore.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
          fi

      - name: Build
        run: |
          TASK="assemble${{ matrix.flavor | title }}${{ matrix.build_type | title }}"
          ./gradlew :app:$TASK --no-daemon -Pandroid.suppressKotlinVersionCompatibilityCheck=true

      - name: Build identity-shell (nonroot)
        if: matrix.flavor == 'nonroot'
        run: |
          TASK="assemble${{ matrix.build_type | title }}"
          ./gradlew :identity-shell-template:$TASK --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.build_type }}-artifacts
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.build_type }}/*.apk
            app/build/outputs/bundle/${{ matrix.flavor }}${{ matrix.build_type | title }}/*.aab
            identity-shell-template/build/outputs/apk/${{ matrix.build_type }}/*.apk
          retention-days: 30
