name: Android Build

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '30.0.14904198'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build-release:
    name: Signed Release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        flavor: [root, nonroot]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is empty" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is empty" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is empty" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is empty" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          test -s keystore.jks || { echo "Decoded keystore is empty" >&2; exit 1; }
          keytool -list -keystore keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          # Read the actual certificate fingerprint from the supplied keystore.
          # Do not rely on the repository's static value: a valid user keystore
          # may legitimately have a different certificate than the local copy.
          RELEASE_SIGNER_SHA256=$(keytool -list -v -keystore keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          if ! [[ "$RELEASE_SIGNER_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "Could not read a valid SHA-256 certificate fingerprint" >&2
            exit 1
          fi
          echo "RELEASE_SIGNER_SHA256=$RELEASE_SIGNER_SHA256" >> "$GITHUB_ENV"
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} release APK
        run: |
          if [ "${{ matrix.flavor }}" = "root" ]; then
            TASK=assembleRootRelease
          else
            TASK=assembleNonrootRelease
          fi
          ./gradlew :app:$TASK --no-daemon --stacktrace -PtrustedReleaseSignerSha256="$RELEASE_SIGNER_SHA256"

      - name: Verify APK signature and output
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=$(find "app/build/outputs/apk/${{ matrix.flavor }}/release" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo "No release APK produced" >&2; exit 1; }
          test -s "$APK"
          echo "APK: $APK"
          sha256sum "$APK"
          apksigner verify --verbose "$APK"
          apksigner verify --verbose --print-certs "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jester-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error
          retention-days: 30
