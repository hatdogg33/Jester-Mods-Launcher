name: Android Build

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '30.0.14904198'
  ANDROID_CMAKE_VERSION: '3.22.1'
  # Backend admin API
  ADMIN_API_URL: 'https://voidmod1.uncledrew697.workers.dev'
  ADMIN_API_TOKEN: 'ZIiq2rquWOR7rnfQ17u+9WVcUIo4DMrpZGL09SEEKK0dz0S2'

jobs:
  build-release:
    name: Signed Release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        flavor: [root, nonroot]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is empty" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is empty" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is empty" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is empty" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          test -s keystore.jks || { echo "Decoded keystore is empty" >&2; exit 1; }
          keytool -list -keystore keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          # Read the actual certificate fingerprint from the supplied keystore.
          # Do not rely on the repository's static value: a valid user keystore
          # may legitimately have a different certificate than the local copy.
          RELEASE_SIGNER_SHA256=$(keytool -list -v -keystore keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          if ! [[ "$RELEASE_SIGNER_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "Could not read a valid SHA-256 certificate fingerprint" >&2
            exit 1
          fi
          echo "RELEASE_SIGNER_SHA256=$RELEASE_SIGNER_SHA256" >> "$GITHUB_ENV"
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build ${{ matrix.flavor }} release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace -PtrustedReleaseSignerSha256="$RELEASE_SIGNER_SHA256"

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK=$(find "app/build/outputs/apk" -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo "No release APK produced" >&2; exit 1; }
          test -s "$APK"
          echo "APK: $APK"
          sha256sum "$APK"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(find "app/build/outputs/apk" -type f -name '*.apk' -print -quit)
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$APKSIGNER" || { echo "apksigner not found at $APKSIGNER" >&2; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jester-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Set version info
        id: version
        run: |
          VERSION=$(grep -o 'versionName\s*=\s*"[^"]*"' app/build.gradle | sed 's/.*versionName\s*=\s*"\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep -o 'versionCode\s*=\s*[0-9]*' app/build.gradle | sed 's/.*versionCode\s*=\s*//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

  publish-release:
    name: Publish to Admin Dashboard
    needs: build-release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Root APK
        uses: actions/download-artifact@v4
        with:
          name: jester-root-release
          path: artifacts/root

      - name: Download Non-root APK
        uses: actions/download-artifact@v4
        with:
          name: jester-nonroot-release
          path: artifacts/nonroot

      - name: Compute version and hashes
        id: info
        run: |
          ROOT_APK=$(find artifacts/root -name '*.apk' -print -quit)
          NONROOT_APK=$(find artifacts/nonroot -name '*.apk' -print -quit)

          ROOT_SHA256=$(sha256sum "$ROOT_APK" | cut -d' ' -f1)
          NONROOT_SHA256=$(sha256sum "$NONROOT_APK" | cut -d' ' -f1)

          ROOT_SIZE=$(stat -c%s "$ROOT_APK")
          NONROOT_SIZE=$(stat -c%s "$NONROOT_APK")

          # Extract version from gradle.properties in the checked-out repo
          VERSION=$(grep '^launcherVersionName=' gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^launcherVersionCode=' gradle.properties | cut -d'=' -f2)

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "ROOT_SHA256=$ROOT_SHA256" >> $GITHUB_OUTPUT
          echo "NONROOT_SHA256=$NONROOT_SHA256" >> $GITHUB_OUTPUT
          echo "ROOT_SIZE=$ROOT_SIZE" >> $GITHUB_OUTPUT
          echo "NONROOT_SIZE=$NONROOT_SIZE" >> $GITHUB_OUTPUT

          echo "Version: $VERSION ($VERSION_CODE)"
          echo "Root: $ROOT_SIZE bytes, $ROOT_SHA256"
          echo "Non-root: $NONROOT_SIZE bytes, $NONROOT_SHA256"

      - name: Upload Root APK to Backend
        if: ${{ steps.info.outputs.VERSION_CODE != '' }}
        run: |
          ROOT_APK=$(find artifacts/root -name '*.apk' -print -quit)
          curl -X POST "${ADMIN_API_URL}/api/_admin/upload?path=launcher/root/${{ steps.info.outputs.VERSION_CODE }}.apk&type=application/vnd.android.package-archive" \
            -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$ROOT_APK" \
            --fail --silent --show-error

      - name: Upload Non-root APK to Backend
        if: ${{ steps.info.outputs.VERSION_CODE != '' }}
        run: |
          NONROOT_APK=$(find artifacts/nonroot -name '*.apk' -print -quit)
          curl -X POST "${ADMIN_API_URL}/api/_admin/upload?path=launcher/nonroot/${{ steps.info.outputs.VERSION_CODE }}.apk&type=application/vnd.android.package-archive" \
            -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$NONROOT_APK" \
            --fail --silent --show-error

      - name: Create Release Record
        env:
          VERSION: ${{ steps.info.outputs.VERSION }}
          VERSION_CODE: ${{ steps.info.outputs.VERSION_CODE }}
          ROOT_SHA256: ${{ steps.info.outputs.ROOT_SHA256 }}
          NONROOT_SHA256: ${{ steps.info.outputs.NONROOT_SHA256 }}
          ROOT_SIZE: ${{ steps.info.outputs.ROOT_SIZE }}
          NONROOT_SIZE: ${{ steps.info.outputs.NONROOT_SIZE }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/"/\\"/g' | cut -c1-300)
          NOTES="Release ${VERSION} (build ${VERSION_CODE})"
          if [ -n "$COMMIT_MSG" ]; then
            NOTES="Release ${VERSION} (build ${VERSION_CODE}) - ${COMMIT_MSG}"
          fi
          curl -X POST "${ADMIN_API_URL}/api/_admin/releases" \
            -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"build\": ${VERSION_CODE},
              \"version\": \"${VERSION}\",
              \"notes\": \"${NOTES}\",
              \"root_path\": \"/api/launcher-download/${VERSION_CODE}/root.apk\",
              \"root_sha256\": \"${ROOT_SHA256}\",
              \"root_size_bytes\": ${ROOT_SIZE},
              \"nonroot_path\": \"/api/launcher-download/${VERSION_CODE}/nonroot.apk\",
              \"nonroot_sha256\": \"${NONROOT_SHA256}\",
              \"nonroot_size_bytes\": ${NONROOT_SIZE},
              \"published_at\": $(date +%s)
            }" \
            --fail --silent --show-error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.VERSION }}
          name: "Jester Mods Launcher v${{ steps.info.outputs.VERSION }}"
          files: |
            artifacts/root/**/*.apk
            artifacts/nonroot/**/*.apk
          generate_release_notes: true
