name: Build Game Modules

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: 'Module directory name (e.g. com.HomeNetGames.Shogun or all)'
        required: true
        default: 'com.HomeNetGames.Shogun'
  push:
    paths:
      - 'modules/**'
      - '.github/workflows/build-module.yml'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '30.0.14904198'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ADMIN_API_URL: 'https://voidmod1.uncledrew697.workers.dev'
  ADMIN_API_TOKEN: 'ZIiq2rquWOR7rnfQ17u+9WVcUIo4DMrpZGL09SEEKK0dz0S2'

jobs:
  build-modules:
    name: Build Module (${{ github.event.inputs.module_name || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Packages & NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Build Modules
        run: |
          set -euo pipefail

          ANDROID_JAR="${ANDROID_HOME}/platforms/android-${ANDROID_API_LEVEL}/android.jar"
          D8="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/d8"
          NDK_PATH="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          CMAKE_TOOLCHAIN="${NDK_PATH}/build/cmake/android.toolchain.cmake"

          mkdir -p module-output

          TARGET_MODULE="${{ github.event.inputs.module_name || 'all' }}"
          MODULE_DIRS=()

          if [ "$TARGET_MODULE" = "all" ] || [ -z "$TARGET_MODULE" ]; then
            for d in modules/*; do
              if [ -d "$d" ]; then
                MODULE_DIRS+=("$d")
              fi
            done
          else
            MODULE_DIRS=("modules/$TARGET_MODULE")
          fi

          for mod_dir in "${MODULE_DIRS[@]}"; do
            [ -d "$mod_dir" ] || continue
            mod_name=$(basename "$mod_dir")
            echo "============================================================"
            echo " Building module: $mod_name"
            echo "============================================================"

            work_dir="/tmp/build-$mod_name"
            rm -rf "$work_dir"
            mkdir -p "$work_dir/classes" "$work_dir/dex" "$work_dir/cmake" "module-output/$mod_name"

            # 1. Compile Java to classes.dex
            echo "--> Compiling Java sources..."
            JAVA_FILES=$(find "$mod_dir/java" -name "*.java")
            javac -source 8 -target 8 -cp "$ANDROID_JAR" -d "$work_dir/classes" $JAVA_FILES
            jar cf "$work_dir/classes.jar" -C "$work_dir/classes" .
            "$D8" --min-api 26 --output "$work_dir/dex" "$work_dir/classes.jar"
            cp "$work_dir/dex/classes.dex" "module-output/$mod_name/classes.dex"

            # 2. Compile C++ to libmenu_native.so (arm64-v8a)
            echo "--> Compiling Native C++ library (arm64-v8a)..."
            cmake -S "$mod_dir/cpp" -B "$work_dir/cmake" \
              -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN" \
              -DANDROID_ABI="arm64-v8a" \
              -DANDROID_PLATFORM="android-26" \
              -DANDROID_NDK="$NDK_PATH" \
              -DCMAKE_BUILD_TYPE=Release

            cmake --build "$work_dir/cmake" --config Release
            find "$work_dir/cmake" -name "libYourSaviour.so" -exec cp {} "module-output/$mod_name/libmenu_native.so" \;

            # 3. Copy config and features JSON
            cp "$mod_dir/config.json" "module-output/$mod_name/config.json"
            if [ -f "$mod_dir/features.json" ]; then
              cp "$mod_dir/features.json" "module-output/$mod_name/features.json"
            fi

            # 4. Package zip bundle
            (cd "module-output/$mod_name" && zip -r "../$mod_name.zip" .)

            echo "--> Successfully built $mod_name!"
            ls -lh "module-output/$mod_name"
          done

      - name: Upload Module Artifacts to Admin Dashboard
        run: |
          set -euo pipefail
          for mod_dir in module-output/*/; do
            [ -d "$mod_dir" ] || continue
            mod_name=$(basename "$mod_dir")
            echo "Publishing module $mod_name to backend..."

            DEX_FILE="$mod_dir/classes.dex"
            SO_FILE="$mod_dir/libmenu_native.so"
            CONFIG_FILE="$mod_dir/config.json"

            if [ -f "$DEX_FILE" ] && [ -f "$SO_FILE" ] && [ -f "$CONFIG_FILE" ]; then
              DEX_SHA=$(sha256sum "$DEX_FILE" | cut -d' ' -f1)
              DEX_SIZE=$(stat -c%s "$DEX_FILE")
              SO_SHA=$(sha256sum "$SO_FILE" | cut -d' ' -f1)
              SO_SIZE=$(stat -c%s "$SO_FILE")

              # Upload DEX
              echo "Uploading classes.dex..."
              curl -X POST "${ADMIN_API_URL}/api/_admin/upload?path=modules/${mod_name}/1/dex/classes.dex&type=application/octet-stream" \
                -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$DEX_FILE" \
                --fail --silent --show-error

              # Upload Native SO
              echo "Uploading libmenu_native.so..."
              curl -X POST "${ADMIN_API_URL}/api/_admin/upload?path=modules/${mod_name}/1/native/arm64-v8a&type=application/octet-stream" \
                -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$SO_FILE" \
                --fail --silent --show-error

              # Record build in backend
              echo "Recording module build in catalog..."
              TITLE=$(grep -o '"title":\s*"[^"]*"' "$CONFIG_FILE" | head -n1 | cut -d'"' -f4 || echo "$mod_name")
              curl -X PUT "${ADMIN_API_URL}/api/_admin/modules/${mod_name}" \
                -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"package_name\": \"${mod_name}\",
                  \"title\": \"${TITLE}\",
                  \"build\": 1,
                  \"default_version\": \"1.0\",
                  \"dex_path\": \"modules/${mod_name}/1/dex/classes.dex\",
                  \"dex_size\": ${DEX_SIZE},
                  \"dex_sha256\": \"${DEX_SHA}\",
                  \"native_path\": \"modules/${mod_name}/1/native/{abi}\",
                  \"native_size\": ${SO_SIZE},
                  \"native_sha256\": \"${SO_SHA}\",
                  \"download_size_by_abi\": {
                    \"arm64-v8a\": $((DEX_SIZE + SO_SIZE))
                  }
                }" \
                --fail --silent --show-error

              echo "--> Published $mod_name successfully!"
            fi
          done

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-modules-output
          path: module-output/
          retention-days: 30
