plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.moodtools.hub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moodtools.hub.nonroot'
        manifestPlaceholders = [launcherLabel: 'Jester Mods']
        minSdk 26
        targetSdk 35
        versionCode project.hasProperty('launcherVersionCode') ? project.property('launcherVersionCode').toInteger() : 413
        versionName project.hasProperty('launcherVersionName') ? project.property('launcherVersionName') : '4.1.3'
        buildConfigField 'String', 'UPDATE_PUBLIC_KEY_DER_BASE64', '""'
        buildConfigField 'String', 'ACCESS_LEASE_PUBLIC_KEY_DER_BASE64', '""'
        buildConfigField 'boolean', 'PRIVATE_MODULE_ENABLED', 'false'
        buildConfigField 'String', 'PRIVATE_MODULE_PACKAGE', '""'
        buildConfigField 'String', 'PRIVATE_MODULE_SCOPE', '""'
        buildConfigField 'String', 'PRIVATE_MODULE_SHA256', '""'
        buildConfigField 'boolean', 'LOCAL_TEST_MODULE_ENABLED', 'false'
        buildConfigField 'String', 'LOCAL_TEST_MODULE_PACKAGE', '""'
        buildConfigField 'String', 'LOCAL_TEST_MODULE_SHA256', '""'
        buildConfigField 'boolean', 'IS_ROOT_MODE', 'false'
        buildConfigField 'boolean', 'RUNTIME_SECURITY_ENFORCED', 'false'
        def signerSha = project.findProperty('trustedReleaseSignerSha256') ?: '54db59fd003fcbceb9fad8808a6eacb10cc9ab58e6be891dc77ef33a62522642,a9faca798e03b4da226240460c8eedc8b1f5b8c04f88525f4ffd8ea2f9fe4f8e'
        buildConfigField 'String', 'TRUSTED_SIGNER_SHA256', "\"${signerSha}\""
        buildConfigField 'String', 'SECURITY_BUILD_CHANNEL', '"release"'
        buildConfigField 'String', 'FLAVOR', '"nonroot"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        releaseConfig {
            def keystorePropertiesFile = file("${rootDir}/keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropertiesFile))
                def storeFilePath = props['storeFile'] ?: 'keystore.jks'
                storeFile storeFilePath.startsWith('/') ? file(storeFilePath) : file("${rootDir}/${storeFilePath}")
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else {
                storeFile file("${rootDir}/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
            debuggable true
            minifyEnabled false
            shrinkResources false
        }

        release {
            signingConfig signingConfigs.releaseConfig
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':Bcore')
    implementation 'com.android.tools.build:apksig:9.0.1'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}
